work_dir: /content/drive/MyDrive/st-gcn-project/runs/kg_only

# feeder
feeder: feeder.feeder.Feeder
num_worker: 4

train_feeder_args:
  data_path: /content/drive/MyDrive/st-gcn-project/datasets/ntu_processed/xsub/train_data.npy
  label_path: /content/drive/MyDrive/st-gcn-project/datasets/ntu_processed/xsub/train_label.pkl
  debug: False

test_feeder_args:
  data_path: /content/drive/MyDrive/st-gcn-project/datasets/ntu_processed/xsub/val_data.npy
  label_path: /content/drive/MyDrive/st-gcn-project/datasets/ntu_processed/xsub/val_label.pkl

# model — KG only (static adj + avg pool)
model: net.st_gcn.Model
model_args:
  in_channels: 3
  num_class: 120
  use_kg: True
  use_temporal_attention: False
  use_dynamic_adj: False
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'

# optimizer
weight_decay: 0.0001
base_lr: 0.1
step: [20, 40]

# training
device: [0]
batch_size: 64
test_batch_size: 128
num_epoch: 50
save_interval: 5
eval_interval: 5
log_interval: 100
